spring.application.name=bank
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:suyash}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Auto-create/update tables if they do not exist.
# Recommended for dev/staging; use 'validate' in strict production migration workflows.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
server.port=${PORT:8080}

# JWT settings for demo
jwt.secret=${JWT_SECRET:changeit-changeit-changeit-changeit-changeit}
jwt.expiration=${JWT_EXPIRATION:3600000}
