spring.application.name=bank
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:suyash}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
server.port=${PORT:8080}

# JWT settings for demo
jwt.secret=${JWT_SECRET:changeit-changeit-changeit-changeit-changeit}
jwt.expiration=${JWT_EXPIRATION:3600000}
